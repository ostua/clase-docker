# Primer ejemplo de stack
services:
  web:
    image: ostua/mirepo:1.1
    deploy:
      replicas: 3
      resources:
        limits:
          cpus: "0.1"
          memory: 50M
      restart_policy:
        condition: on-failure
    ports:
      - "7080:80"
    networks:
      - webnet
networks:
  webnet:
